[project]
name = "before-it-falls"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "requests",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "laspy[lazrs]",
    "lightgbm",
    "scikit-learn",
    "shap",
    "torch",
    "torchvision",
    "timm",
    "numba",
    "tabulate>=0.10.0",
    "transformers>=4.56",
    "segmentation-models-pytorch>=0.5.0",
    "psutil>=7.2.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
